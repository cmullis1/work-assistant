[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-assistant"
version = "0.1.0"
description = "Reviews Zendesk support calls with Claude and reports results in a local web app."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "httpx",
    "fastapi",
    "uvicorn",
    "keyring",
    "openpyxl",
    "tzlocal",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[project.scripts]
work-assistant = "work_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
work_assistant = ["seed_reference/*.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
